[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-review-pipeline"
version = "0.1.0"
description = "Auditable multi-role pipeline for the Spotify review assignment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
local = [
  "mlx-lm==0.31.3",
  "psutil==7.2.2",
]
distilled = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
]
embedding = [
  "torch==2.14.1",
  "sentence-transformers==6.1.0",
]
dashboard = ["psycopg[binary]==3.3.6"]
dev = ["pytest==9.1.1"]

[project.scripts]
spotify-pipeline = "spotify_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spotify_pipeline = ["prompt_text/*.md"]
